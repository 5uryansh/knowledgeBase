# Copy to kb.yaml (git-ignored) and adjust. Every key is optional.

# Where the Obsidian vault + indexes are written. Open this folder in Obsidian.
vault_dir: /mnt/c/Users/<you>/Documents/KnowledgeBase

# Where your raw exports live (defaults shown).
exports:
  chatgpt: data/chatgpt/conversations.json
  claude: data/claude/conversations.json
  gemini: data/gemini/Takeout/My Activity/Gemini Apps/MyActivity.json
  claude-code: data/claude-code/projects        # a copy of ~/.claude/projects

embedder: auto            # auto | sentence-transformers | wordllama | none
embed_model: BAAI/bge-small-en-v1.5
entity_extractor: auto    # auto | gliner | spacy

# aliases_file: my_aliases.yaml   # extra canonical names, e.g.  PyTorch: [torch, pt2]
# stop_words_file: my_stop_words.yaml

host: 127.0.0.1
port: 3001
