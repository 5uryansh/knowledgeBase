[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebase"
version = "0.2.0"
description = "Graph-first personal knowledge base built from your LLM chat history (ChatGPT, Claude, Gemini, Claude Code)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "yake>=0.4.8",
    "spacy>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Best quality (default on a normal machine): transformer embeddings + GLiNER entities.
ml = [
    "sentence-transformers>=3.0",
    "gliner>=0.2.10",
    "faiss-cpu>=1.8",
]
# Tiny, torch-free static embeddings (~16 MB, ships its weights inside the wheel).
lite = ["wordllama>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kb = "knowledgebase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledgebase = ["resources/*.yaml", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
