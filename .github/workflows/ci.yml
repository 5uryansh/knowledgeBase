name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev,lite]"
          python -m spacy download en_core_web_sm
      - name: Test
        run: pytest -q
      - name: Sample benchmark (sanity check)
        run: python -m benchmarks.sample --embedder wordllama --entities spacy
